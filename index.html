<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stingy-namake · projetos</title>
  <meta name="description" content="Projetos e protótipos de stingy-namake.">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 20% 0%, #ccfbf1, transparent 40%), #f4f7fb;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main { width: min(560px, 100%); }
    h1 { margin: 0 0 6px; color: #0b1f3a; font-size: 26px; letter-spacing: -0.02em; }
    p { margin: 0 0 24px; color: #64748b; font-size: 14px; }
    a.card {
      display: block;
      padding: 20px 22px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }
    a.card:hover, a.card:focus-visible {
      transform: translateY(-2px);
      border-color: #14b8a6;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.12);
    }
    a.card:focus-visible { outline: 3px solid #14b8a6; outline-offset: 3px; }
    .tag {
      display: inline-block;
      margin-bottom: 8px;
      padding: 3px 9px;
      border-radius: 999px;
      background: #ccfbf1;
      color: #0f766e;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    strong { display: block; margin-bottom: 4px; color: #0b1f3a; font-size: 17px; }
    span.desc { display: block; color: #64748b; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>stingy-namake</h1>
    <p>Projetos e protótipos publicados.</p>

    <a class="card" href="service-desk/">
      <span class="tag">Governança em TI</span>
      <strong>Service Desk IPEC</strong>
      <span class="desc">Protótipo acadêmico de central de serviços com dashboard de indicadores, SLAs e escalonamento N1–N3.</span>
    </a>
  </main>
</body>
</html>
